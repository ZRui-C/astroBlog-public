ass="lyrics-scroll relative max-h-[320px] overflow-y-auto rounded-xl border border-gray-200 bg-gray-50 p-4" data-astro-cid-zetdm5md> <div id="lyrics-list" class="space-y-2 text-sm leading-relaxed text-gray-500 transition" data-astro-cid-zetdm5md> <p class="text-xs text-gray-400" data-astro-cid-zetdm5md>歌词加载中……</p> </div> <div class="pointer-events-none absolute inset-x-0 top-0 h-10 bg-gradient-to-b from-gray-50 via-gray-50/40 to-transparent" data-astro-cid-zetdm5md></div> <div class="pointer-events-none absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-gray-50 via-gray-50/40 to-transparent" data-astro-cid-zetdm5md></div> </div> </div> </div> <a href="/" class="mx-auto text-sm text-red-700 underline underline-offset-4 hover:text-red-800" data-astro-cid-zetdm5md>

</a> </section> <script type="module">
    const audio = document.getElementById("apple-player");
    const playToggle = document.getElementById("play-toggle");
    const iconPlay = document.getElementById("icon-play");
    const iconPause = document.getElementById("icon-pause");
    const progressRangeElement = document.getElementById("progress-range");
    const progressFill = document.getElementById("progress-fill");
    const timeCurrent = document.getElementById("time-current");
    const timeDuration = document.getElementById("time-duration");
    const lyricsPanel = document.getElementById("lyrics-panel");
    const lyricsList = document.getElementById("lyrics-list");

    if (
      !(audio instanceof HTMLAudioElement) ||
      !(playToggle instanceof HTMLButtonElement) ||
      !(progressRangeElement instanceof HTMLInputElement) ||
      !(progressFill instanceof HTMLElement) ||
      !(timeCurrent instanceof HTMLElement) ||
      !(timeDuration instanceof HTMLElement) ||
      !(lyricsPanel instanceof HTMLElement) ||
      !(lyricsList instanceof HTMLElement) ||
      !(iconPlay instanceof SVGElement) ||
      !(iconPause instanceof SVGElement)
    ) {
      console.error("播放器元素初始化失败");
    } else {
      const progressRange = progressRangeElement;
      const lyricsSource = lyricsPanel.dataset.lyrics || "";
      let lyricsData = [];
      let activeIndex = -1;
      let isSeeking = false;

      function updateIcons(isPlaying) {
        if (isPlaying) {
          iconPlay.classList.add("hidden");
          iconPause.classList.remove("hidden");
        } else {
          iconPause.classList.add("hidden");
          iconPlay.classList.remove("hidden");
        }
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
          return "0:00";
        }
        const wholeSeconds = Math.floor(seconds);
        const mins = Math.floor(wholeSeconds / 60);
        const secs = wholeSeconds % 60;
        return `${mins}:${secs.toString().padStart(2, "0")}`;
      }

      function parseLRC(raw) {
        const lines = raw.split(/\r?\n/);
        const entries = [];
        const timeRegex = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;

        for (const line of lines) {
          if (!line.trim()) continue;
          let match;
          let text = line.replace(timeRegex, "").trim();
          if (!text) {
            text = "♪";
          }
          timeRegex.lastIndex = 0;
          while ((match = timeRegex.exec(line)) !== null) {
            const minutes = Number.parseInt(match[1], 10);
            const seconds = Number.parseInt(match[2], 10);
            const milli = match[3]
              ? Number.parseInt(match[3].padEnd(3, "0").slice(0, 3), 10)
              : 0;
            const time = minutes * 60 + seconds + milli / 1000;
            entries.push({ time, text });
          }
        }

        return entries.sort((a, b) => a.time - b.time);
      }

      function renderLyrics(entries) {
        lyricsList.innerHTML = "";
        const fragment = document.createDocumentFragment();
        entries.forEach(({ text }, index) => {
          const line = document.createElement("p");
          line.className =
            "lyric-line rounded-md px-2 py-1 text-sm text-gray-500 transition-colors duration-200";
          line.dataset.index = index.toString();
          line.textContent = text;
          fragment.appendChild(line);
        });
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "text-xs text-gray-400";
          empty.textContent = "暂无可用歌词";
          fragment.appendChild(empty);
        }
        lyricsList.appendChild(fragment);
      }

      function scrollToActive(target) {
        if (!lyricsList.children.length) return;
        const node = lyricsList.children[target];
        if (!node) return;
        const offset =
          node.offsetTop - lyricsPanel.clientHeight / 2 + node.clientHeight / 2;
        lyricsPanel.scrollTo({ top: Math.max(offset, 0), behavior: "smooth" });
      }

      function highlightLine(target) {
        if (activeIndex === target) return;
        if (activeIndex >= 0 && lyricsList.children[activeIndex]) {
          lyricsList.children[activeIndex].classList.remove(
            "text-gray-900",
            "font-semibold",
          );
          lyricsList.children[activeIndex].classList.add("text-gray-500");
        }
        if (target >= 0 && lyricsList.children[target]) {
          lyricsList.children[target].classList.remove("text-gray-500");
          lyricsList.children[target].classList.add(
            "text-gray-900",
            "font-semibold",
          );
          scrollToActive(target);
        }
        activeIndex = target;
      }

      function syncLyrics(currentTime) {
        if (!lyricsData.length) return;
        let targetIndex = -1;
        for (let i = 0; i < lyricsData.length; i += 1) {
          if (currentTime + 0.25 >= lyricsData[i].time) {
            targetIndex = i;
          } else {
            break;
          }
        }
        highlightLine(targetIndex);
      }

      async function loadLyrics() {
        if (!lyricsSource) {
          lyricsList.innerHTML =
            '<p class="text-xs text-gray-400">未提供歌词文件。</p>';
          return;
        }
        try {
          const response = await fetch(lyricsSource);
          if (!response.ok) throw new Error("歌词加载失败");
          const text = await response.text();
          lyricsData = parseLRC(text);
          renderLyrics(lyricsData);
        } catch (error) {
          console.error(error);
          lyricsList.innerHTML =
            '<p class="text-xs text-gray-400">无法加载歌词，请稍后重试。</p>';
        }
      }

      playToggle.addEventListener("click", () => {
        if (audio.paused) {
          audio
            .play()
            .then(() => updateIcons(true))
            .catch((error) => {
              console.error(error);
            });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener("play", () => updateIcons(true));
      audio.addEventListener("pause", () => updateIcons(false));

      audio.addEventListener("loadedmetadata", () => {
        progressRange.max = Math.floor(audio.duration * 1000).toString();
        timeDuration.textContent = formatTime(audio.duration);
        timeCurrent.textContent = formatTime(0);
        updateIcons(false);
      });

      audio.addEventListener("timeupdate", () => {
        if (isSeeking) return;
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          const progress = Math.min(audio.currentTime / audio.duration, 1);
          progressFill.style.width = `${progress * 100}%`;
          progressRange.value = Math.floor(audio.currentTime * 1000).toString();
        }
        timeCurrent.textContent = formatTime(audio.currentTime);
        syncLyrics(audio.currentTime);
      });

      audio.addEventListener("ended", () => {
        updateIcons(false);
        highlightLine(-1);
        lyricsPanel.scrollTo({ top: 0, behavior: "smooth" });
      });

      progressRange.addEventListener("input", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        const value = Number.parseInt(target.value, 10) || 0;
        const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
        if (duration <= 0) return;
        const progress = Math.min(value / (duration * 1000), 1);
        progressFill.style.width = `${progress * 100}%`;
        timeCurrent.textContent = formatTime(progress * duration);
        isSeeking = true;
      });

      progressRange.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        const value = Number.parseInt(target.value, 10) || 0;
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
        audio.currentTime = Math.min(value / 1000, audio.duration);
        isSeeking = false;
      });

      lyricsPanel.addEventListener("click", (event) => {
        const targetNode = event.target;
        if (!(targetNode instanceof HTMLElement)) return;
        const line = targetNode.closest(".lyric-line");
        if (!line) return;
        const index = Number.parseInt(line.dataset.index || "-1", 10);
        if (index < 0 || !lyricsData[index]) return;
        audio.currentTime = lyricsData[index].time + 0.05;
        if (audio.paused) {
          audio.play().catch(() => {});
        }
      });

      updateIcons(false);
      loadLyrics();
    }
  </script>  </html>
