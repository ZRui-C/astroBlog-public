  async function decrypt(data, key) {
    key = key.padEnd(16, "0");

    const decoder = new TextDecoder();
    const dataBuffer = new Uint8Array(
      atob(data)
        .split("")
        .map((c) => c.charCodeAt(0)),
    );
    const keyBuffer = new TextEncoder().encode(key);

    const cryptoKey = await crypto.subtle.importKey(
      "raw",
      keyBuffer,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"],
    );

    const iv = dataBuffer.slice(0, 16);
    const encryptedData = dataBuffer.slice(16);

    const decryptedData = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      cryptoKey,
      encryptedData,
    );

    return decoder.decode(decryptedData);
  }

  function prepare() {
    const encrypted = document
      .querySelector("meta[name=encrypted]")
      ?.getAttribute("content");
    const input = document.getElementById("password");
    const btn = document.getElementById("password-btn");
    const article = document.querySelector("#article");

    btn?.addEventListener("click", async () => {
      const password = input.value;
      try {
        const html = await decrypt(encrypted, password);
        article.innerHTML = html;
      } catch (e) {
        alert("密码错误");
      }
    });
  }

  prepare();
  document.addEventListener("astro:after-swap", prepare);

  const PDF_JS_SRC =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
  const PDF_WORKER_SRC =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  let pdfJsPromise;
  let mutationObserver;
  let observedArticle;

  function loadPdfJs() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
      return Promise.resolve(window.pdfjsLib);
    }
    if (pdfJsPromise) return pdfJsPromise;
    pdfJsPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = PDF_JS_SRC;
      script.async = true;
      script.onload = () => {
        if (!window.pdfjsLib) {
          reject(new Error("PDF.js loaded but pdfjsLib is missing."));
          return;
        }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
        resolve(window.pdfjsLib);
      };
      script.onerror = () => reject(new Error("Failed to load PDF.js."));
      document.head.appendChild(script);
    });
    return pdfJsPromise;
  }

  function collectPdfEmbeds(root) {
    const containers = [];
    if (root?.nodeType === 1) {
      if (root.matches(".pdf-embed[data-pdf-url]")) {
        containers.push(root);
      }
      containers.push(
        ...root.querySelectorAll?.(".pdf-embed[data-pdf-url]"),
      );
    }
    if (root === document) {
      containers.push(...document.querySelectorAll(".pdf-embed[data-pdf-url]"));
    }
    return containers;
  }

  function preparePdfEmbed(container) {
    if (container.dataset.pdfPrepared === "true") return;
    container.dataset.pdfPrepared = "true";

    const link = container.querySelector(".pdf-embed__link");
    const caption = container.querySelector(".pdf-embed__caption");
    const actions = document.createElement("div");
    actions.className = "pdf-embed__actions";

    if (link) {
      actions.appendChild(link);
    }

    const loadButton = document.createElement("button");
    loadButton.type = "button";
    loadButton.className = "pdf-embed__button pdf-embed__load";
    loadButton.textContent = "加载 PDF";
    loadButton.addEventListener("click", () => {
      if (container.dataset.pdfRendered === "loading") return;
      loadButton.disabled = true;
      loadButton.textContent = "加载中...";
      renderPdf(container).finally(() => {
        if (container.dataset.pdfRendered !== "true") {
          loadButton.disabled = false;
          loadButton.textContent = "加载 PDF";
        }
      });
    });
    actions.appendChild(loadButton);

    if (caption) {
      container.insertBefore(actions, caption);
    } else {
      container.appendChild(actions);
    }
  }

  async function renderPdf(container) {
    if (
      container.dataset.pdfRendered === "true" ||
      container.dataset.pdfRendered === "loading"
    )
      return;
    const url = container.dataset.pdfUrl;
    if (!url) return;

    container.dataset.pdfRendered = "loading";
    const fallbackHtml = container.innerHTML;
    const fallbackLink = container.querySelector("a")?.cloneNode(true);
    const fallbackCaption = container
      .querySelector(".pdf-embed__caption")
      ?.cloneNode(true);

    let pdfjsLib;
    try {
      pdfjsLib = await loadPdfJs();
