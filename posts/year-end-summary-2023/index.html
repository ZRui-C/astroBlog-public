</button> <br> <a href="/posts/about-password" class="text-sm text-gray-500">关于密码</a> </div> <script data-astro-rerun>
  async function decrypt(data, key) {
    key = key.padEnd(16, "0");

    const decoder = new TextDecoder();
    const dataBuffer = new Uint8Array(
      atob(data)
        .split("")
        .map((c) => c.charCodeAt(0)),
    );
    const keyBuffer = new TextEncoder().encode(key);

    const cryptoKey = await crypto.subtle.importKey(
      "raw",
      keyBuffer,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"],
    );

    const iv = dataBuffer.slice(0, 16);
    const encryptedData = dataBuffer.slice(16);

    const decryptedData = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      cryptoKey,
      encryptedData,
    );

    return decoder.decode(decryptedData);
  }

  function prepare() {
    const encrypted = document
      .querySelector("meta[name=encrypted]")
      ?.getAttribute("content");
    const input = document.getElementById("password");
    const btn = document.getElementById("password-btn");
    const article = document.querySelector("#article");

    btn?.addEventListener("click", async () => {
      const password = input.value;
      try {
        const html = await decrypt(encrypted, password);
        article.innerHTML = html;
      } catch (e) {
        alert("密码错误");
      }
    });
  }

  prepare();
  document.addEventListener("astro:after-swap", prepare);
</script> </article> </div> </main>  </div> </main> <!-- Footer --> <footer class="flex flex-col w-full max-w-7xl mb-4 justify-center align-center print:hidden px-5 md:px-10 lg:px-12 xl:px-16undefined"> <div class="flex flex-col text-nowrap md:flex-row mx-auto flex w-full items-start md:items-center justify-between align-end"> <span class="text-sm font-light">写于2023年12月30日</span> <div class="mb-4 mt-4 flex w-full flex-col items-start justify-center md:flex-row md:gap-8 md:max-w-[40%] print:hidden"> <a href="/posts/build-sysy-lex-analyzer-with-flex" class="text-sm font-light text-black underline hover:text-red-700 truncate block w-full md:w-auto">
