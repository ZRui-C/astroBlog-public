  async function decrypt(data, key) {
    key = key.padEnd(16, "0");

    const decoder = new TextDecoder();
    const dataBuffer = new Uint8Array(
      atob(data)
        .split("")
        .map((c) => c.charCodeAt(0)),
    );
    const keyBuffer = new TextEncoder().encode(key);

    const cryptoKey = await crypto.subtle.importKey(
      "raw",
      keyBuffer,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"],
    );

    const iv = dataBuffer.slice(0, 16);
    const encryptedData = dataBuffer.slice(16);

    const decryptedData = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      cryptoKey,
      encryptedData,
    );

    return decoder.decode(decryptedData);
  }

  function prepare() {
    const encrypted = document
      .querySelector("meta[name=encrypted]")
      ?.getAttribute("content");
    const input = document.getElementById("password");
    const btn = document.getElementById("password-btn");
    const article = document.querySelector("#article");

    btn?.addEventListener("click", async () => {
      const password = input.value;
      try {
        const html = await decrypt(encrypted, password);
        article.innerHTML = html;
      } catch (e) {
        alert("密码错误");
      }
    });
  }

  prepare();
  document.addEventListener("astro:after-swap", prepare);

  const PDF_JS_SRC =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
  const PDF_WORKER_SRC =
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

  let pdfJsPromise;
  let mutationObserver;
  let observedArticle;

  function loadPdfJs() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
      return Promise.resolve(window.pdfjsLib);
    }
    if (pdfJsPromise) return pdfJsPromise;
    pdfJsPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = PDF_JS_SRC;
      script.async = true;
      script.onload = () => {
        if (!window.pdfjsLib) {
          reject(new Error("PDF.js loaded but pdfjsLib is missing."));
          return;
        }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC;
        resolve(window.pdfjsLib);
      };
      script.onerror = () => reject(new Error("Failed to load PDF.js."));
      document.head.appendChild(script);
    });
    return pdfJsPromise;
  }

  function collectPdfEmbeds(root) {
    const containers = [];
    if (root?.nodeType === 1) {
      if (root.matches(".pdf-embed[data-pdf-url]")) {
        containers.push(root);
      }
      containers.push(
        ...root.querySelectorAll?.(".pdf-embed[data-pdf-url]"),
      );
    }
    if (root === document) {
      containers.push(...document.querySelectorAll(".pdf-embed[data-pdf-url]"));
    }
    return containers;
  }

  function preparePdfEmbed(container) {
    if (container.dataset.pdfPrepared === "true") return;
    container.dataset.pdfPrepared = "true";

    const link = container.querySelector(".pdf-embed__link");
    const caption = container.querySelector(".pdf-embed__caption");
    const actions = document.createElement("div");
    actions.className = "pdf-embed__actions";

    if (link) {
      actions.appendChild(link);
    }

    const loadButton = document.createElement("button");
    loadButton.type = "button";
    loadButton.className = "pdf-embed__button pdf-embed__load";
    loadButton.textContent = "加载 PDF";
    loadButton.addEventListener("click", () => {
      if (container.dataset.pdfRendered === "loading") return;
      loadButton.disabled = true;
      loadButton.textContent = "加载中...";
      renderPdf(container).finally(() => {
        if (container.dataset.pdfRendered !== "true") {
          loadButton.disabled = false;
          loadButton.textContent = "加载 PDF";
        }
      });
    });
    actions.appendChild(loadButton);

    if (caption) {
      container.insertBefore(actions, caption);
    } else {
      container.appendChild(actions);
    }
  }

  async function renderPdf(container) {
    if (
      container.dataset.pdfRendered === "true" ||
      container.dataset.pdfRendered === "loading"
    )
      return;
    const url = container.dataset.pdfUrl;
    if (!url) return;

    container.dataset.pdfRendered = "loading";
    const fallbackHtml = container.innerHTML;
    const fallbackLink = container.querySelector("a")?.cloneNode(true);
    const fallbackCaption = container
      .querySelector(".pdf-embed__caption")
      ?.cloneNode(true);

    let pdfjsLib;
    try {
      pdfjsLib = await loadPdfJs();
    } catch (error) {
      console.warn("[pdf] PDF.js load failed:", error);
      container.dataset.pdfRendered = "error";
      return;
    }

    try {
      const loadingTask = pdfjsLib.getDocument({ url });
      const pdf = await loadingTask.promise;
      const toolbar = document.createElement("div");
      toolbar.className = "pdf-embed__toolbar";
      if (fallbackLink) toolbar.appendChild(fallbackLink);

      const meta = document.createElement("span");
      meta.className = "pdf-embed__meta";

      const pager = document.createElement("div");
      pager.className = "pdf-embed__pager";

      const controls = document.createElement("div");
      controls.className = "pdf-embed__controls";

      const prevButton = document.createElement("button");
      prevButton.type = "button";
      prevButton.className = "pdf-embed__button";
      prevButton.textContent = "Prev";
      prevButton.setAttribute("aria-label", "Previous page");

      const nextButton = document.createElement("button");
      nextButton.type = "button";
      nextButton.className = "pdf-embed__button";
      nextButton.textContent = "Next";
      nextButton.setAttribute("aria-label", "Next page");

      controls.appendChild(prevButton);
      controls.appendChild(nextButton);

      pager.appendChild(meta);
      pager.appendChild(controls);
      toolbar.appendChild(pager);

      const viewer = document.createElement("div");
      viewer.className = "pdf-embed__viewer";
      const pageWrapper = document.createElement("div");
      pageWrapper.className = "pdf-embed__page";
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      if (!context) {
        throw new Error("Canvas 2D context is not available.");
      }
      pageWrapper.appendChild(canvas);
      viewer.appendChild(pageWrapper);

      const dpr = window.devicePixelRatio || 1;
      let currentPage = 1;
      let rendering = false;
      let pendingPage = null;

      const restoreFallback = (error) => {
        console.warn("[pdf] Failed to render PDF:", error);
        container.dataset.pdfRendered = "error";
        container.innerHTML = fallbackHtml;
        container.dataset.pdfPrepared = "false";
        preparePdfEmbed(container);
      };

      const updateButtons = () => {
        prevButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= pdf.numPages;
        meta.textContent = `Page ${currentPage} / ${pdf.numPages}`;
      };

      const renderPage = async (pageNum) => {
        if (rendering) {
          pendingPage = pageNum;
          return;
        }
        rendering = true;
        try {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1 });
          const maxWidth = container.clientWidth || 640;
          const scale = maxWidth / viewport.width;
          const scaledViewport = page.getViewport({ scale: scale * dpr });
          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;
          canvas.style.width = `${scaledViewport.width / dpr}px`;
          canvas.style.height = `${scaledViewport.height / dpr}px`;

          await page.render({ canvasContext: context, viewport: scaledViewport })
            .promise;
          currentPage = pageNum;
          updateButtons();
        } catch (error) {
          restoreFallback(error);
          return;
        } finally {
          rendering = false;
        }

        if (pendingPage !== null && pendingPage !== currentPage) {
          const nextPage = pendingPage;
          pendingPage = null;
          await renderPage(nextPage);
        } else {
          pendingPage = null;
        }
      };

      prevButton.addEventListener("click", () => {
        if (currentPage > 1) {
          renderPage(currentPage - 1);
        }
      });

      nextButton.addEventListener("click", () => {
        if (currentPage < pdf.numPages) {
          renderPage(currentPage + 1);
        }
      });

      await renderPage(1);
      container.textContent = "";
      container.appendChild(toolbar);
      container.appendChild(viewer);
      if (fallbackCaption) {
        container.appendChild(fallbackCaption);
      }

      container.dataset.pdfRendered = "true";
    } catch (error) {
      container.dataset.pdfRendered = "error";
      container.innerHTML = fallbackHtml;
      container.dataset.pdfPrepared = "false";
      preparePdfEmbed(container);
    }
  }

  function setupPdfEmbeds() {
    collectPdfEmbeds(document).forEach((container) => {
      preparePdfEmbed(container);
    });

    const article = document.querySelector("#article");
    if (!article) return;
    if (observedArticle === article && mutationObserver) return;

    mutationObserver?.disconnect();
    mutationObserver = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          collectPdfEmbeds(node).forEach((container) => {
            preparePdfEmbed(container);
          });
        });
      });
    });

    mutationObserver.observe(article, { childList: true, subtree: true });
    observedArticle = article;
  }

  setupPdfEmbeds();
  document.addEventListener("astro:after-swap", setupPdfEmbeds);
</script> <script type="module" src="/_astro/ImageEnhancement.astro_astro_type_script_index_0_lang.D3ij_ksR.js"></script> </div> </body></html>
